<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="./index.css">
</head>
<body>
  <h1>Responsive Image Filter Gallery</h1>
  <div class="gallery">
    <div>
      <img src="https://picsum.photos/400?1" alt="Image 1">
      <p>Blur</p>
    </div>
    <div>
      <img src="https://picsum.photos/400?2" alt="Image 2">
      <p>Grayscale</p>
    </div>
    <div>
      <img src="https://picsum.photos/400?3" alt="Image 3">
      <p>Sepia</p>
    </div>
    <div>
      <img src="https://picsum.photos/400?4" alt="Image 4">
      <p>Brightness</p>
    </div>
    <div>
      <img src="https://picsum.photos/400?5" alt="Image 5">
      <p>Contrast</p>
    </div>
    <div>
      <img src="https://picsum.photos/400?6" alt="Image 6">
      <p>Hue Rotate</p>
    </div>
  </div>
</body>
</html>
