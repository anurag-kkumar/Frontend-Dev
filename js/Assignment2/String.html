<!DOCTYPE html>
<html>
<head>
    <title>String Manipulation</title>
</head>
<body>

<h2>Product Title Formatter</h2>

<p id="output"></p>
<p id="length"></p>

<script>
let product = " wireless headphones PRO ";
product = product.trim();
product = product.toLowerCase();
product = product.split(" ").map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(" ");
product = product.replace("Pro", "Pro Edition");
document.getElementById("output").innerText = "Cleaned Title: " + product;
document.getElementById("length").innerText = "Title Length: " + product.length;
</script>

</body>
</html>
