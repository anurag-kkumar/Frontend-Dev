<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Q4 Output</h3>
<script>
let scores = [];
for (let i = 0; i < 8; i++) {
    scores[i] = Math.floor(Math.random() * 71) + 30;
}

let highest = scores[0];
let lowest = scores[0];
let sum = 0;
let passed = 0;

for (let i = 0; i < scores.length; i++) {
    if (scores[i] > highest) highest = scores[i];
    if (scores[i] < lowest) lowest = scores[i];
    sum += scores[i];
    if (scores[i] >= 50) passed++;
}

let average = sum / scores.length;

let result = `
Scores: ${scores.join(", ")}
Highest: ${highest}
Lowest: ${lowest}
Average: ${average.toFixed(2)}
Passed: ${passed}
`;

console.log(result);
</script>

</body>
</html>
